<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="update.css">
  <script src="glass.js"></script>
</head>
<body class="update">
<div class="glass group update-card">
  <div class="update-head">
    <span class="logo">V</span>
    <div>
      <b data-i18n="update.title"></b>
      <small id="update-version"></small>
    </div>
  </div>
  <h2 data-i18n="update.notes"></h2>
  <pre id="update-notes" class="update-notes"></pre>
  <p id="update-error" class="note err" hidden></p>
  <div class="update-actions">
    <button id="skip" class="btn update-skip" data-i18n="update.skip"></button>
    <button id="later" class="btn" data-i18n="update.later"></button>
    <button id="install" class="btn btn-primary" data-i18n="update.install"></button>
  </div>
</div>
<script src="i18n.js"></script>
<script src="update.js"></script>
</body>
</html>
