<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVKey</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel" id="panel">
  <label class="row big">
    <span class="grow" data-i18n="popup.vi_typing"></span>
    <span class="switch"><input type="checkbox" id="mode"><i></i></span>
  </label>

  <div class="section" id="input-section">
    <button class="head" id="input-head">
      <span data-i18n="popup.input_type"></span>
      <span class="value" id="input-value"></span>
      <span class="chev">›</span>
    </button>
    <div class="list" id="input-list" hidden></div>
  </div>

  <div class="section" id="table-section">
    <button class="head" id="table-head">
      <span data-i18n="popup.table"></span>
      <span class="value" id="table-value"></span>
      <span class="chev">›</span>
    </button>
    <div class="list" id="table-list" hidden></div>
  </div>

  <div class="sep"></div>

  <button class="row" id="macro">
    <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h6"/></svg>
    <span class="grow" data-i18n="popup.macro"></span>
  </button>
  <button class="row" id="settings">
    <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h6M12 4h2M2 12h2M8 12h6"/><circle cx="10" cy="4" r="1.6"/><circle cx="6" cy="12" r="1.6"/></svg>
    <span class="grow" data-i18n="popup.settings"></span>
  </button>

  <div class="sep"></div>

  <button class="row" id="quit">
    <span class="grow" data-i18n="popup.quit"></span>
  </button>
</div>
<script src="i18n.js"></script>
<script src="glass.js"></script>
<script src="popup.js"></script>
</body>
</html>
