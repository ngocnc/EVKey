<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVKey</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
  <script src="glass.js"></script>
</head>
<body>
<div class="panel" id="panel">
  <label class="head">
    <span class="logo">V</span>
    <span class="grow"><span class="t" data-i18n="popup.vi_typing"></span><span class="s" id="popup-sub"></span></span>
    <input class="switch" type="checkbox" id="mode">
  </label>

  <div class="sep"></div>

  <div class="section open" id="input-section">
    <div class="cap" id="input-head"><span data-i18n="popup.input_type"></span><span class="value" id="input-value"></span></div>
    <div class="list" id="input-list"></div>
  </div>

  <div class="sep"></div>

  <div class="section" id="table-section">
    <button class="mi" id="table-head">
      <span class="chk"></span>
      <span class="grow" data-i18n="popup.table"></span>
      <span class="sub" id="table-value"></span>
      <span class="chev">›</span>
    </button>
    <div class="list" id="table-list" hidden></div>
  </div>

  <div class="sep"></div>

  <button class="mi" id="macro"><span class="chk"></span><span class="grow" data-i18n="popup.macro"></span></button>
  <button class="mi" id="settings"><span class="chk"></span><span class="grow" data-i18n="popup.settings"></span></button>
  <button class="mi" id="quit"><span class="chk"></span><span class="grow" data-i18n="popup.quit"></span></button>
</div>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
