[workspace]
resolver = "3"
members = ["crates/*"]
# The Windows-only crate (app) is excluded from plain `cargo build`/`cargo test` so macOS can build the shared crates.
default-members = ["crates/engine", "crates/core"]

[workspace.package]
version = "3.1.1"
edition = "2024"
license = "GPL-3.0-only"
