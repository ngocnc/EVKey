[workspace]
resolver = "3"
members = ["crates/*"]
# Windows-only crates (app, tsf) are excluded from plain `cargo build`/`cargo test` so macOS can build the shared crates.
default-members = ["crates/engine", "crates/core"]

[workspace.package]
version = "2.2.1"
edition = "2024"
license = "GPL-3.0-only"
