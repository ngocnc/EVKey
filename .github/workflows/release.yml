# Release pipeline: push a tag `v<version>` -> tests, installer build, GitHub Release, winget submission.
#
# One-time user steps:
#   1. Create a classic PAT with `public_repo` scope (or fine-grained with access to microsoft/winget-pkgs)
#      and store it as repository secret `WINGET_TOKEN`. Without it the winget job is skipped.
#   2. Fork https://github.com/microsoft/winget-pkgs to your account (the `fork-user` below = repo owner).
#   3. Submit the first manifest by hand: `wingetcreate new <installer-url>` (or `winget-create`), using
#      packaging/winget/ as the reference. winget-releaser only updates an existing package.
# Pre-release tags (containing `-`, e.g. v2.1.0-rc1) build and publish the GitHub Release but skip winget.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?ms)\[workspace\.package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $v) { throw 'version not found' }
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo version v$v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run engine tests
        run: cargo test -p evkey-engine --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: scripts/build-installer.ps1

      - name: Write SHA256 notes
        id: sha
        shell: pwsh
        run: |
          $exe = "dist/EVKey-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "SHA256: ``$hash``" | Out-File -Encoding utf8 release-notes.md
          "SHA256 $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EVKey-Setup-${{ steps.version.outputs.version }}.exe
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  winget:
    needs: build
    # Skip pre-releases. The secret itself is checked in a step (secrets are not allowed in job-level `if`).
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check WINGET_TOKEN is set
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "WINGET_TOKEN not set; skipping winget" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish to winget
        if: steps.gate.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: chrisnguyen.EVKey
          installers-regex: 'EVKey-Setup-.*\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: ${{ github.repository_owner }}
