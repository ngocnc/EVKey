# Release pipeline: push a tag `v<version>` -> tests, Windows installer (.exe) and macOS dmg attached to a GitHub Release.
# Pre-release tags (containing `-`, e.g. v2.1.0-rc1) are published as GitHub pre-releases.
# macOS: a universal dmg is built on macos-latest and attached to the same GitHub Release.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?ms)\[workspace\.package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $v) { throw 'version not found' }
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo version v$v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run engine tests
        run: cargo test -p evkey-engine --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: scripts/build-installer.ps1

      - name: Write SHA256 notes
        id: sha
        shell: pwsh
        run: |
          $exe = "dist/EVKey-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # Release body = the version's section of RELEASE_NOTES.md (shown by the in-app updater) + the hash line.
          $ver = "${{ steps.version.outputs.version }}"
          $section = @(); $in = $false
          foreach ($line in Get-Content RELEASE_NOTES.md -Encoding utf8) {
            if ($line -match '^## v') { $in = ($line -eq "## v$ver"); continue }
            if ($in) { $section += $line }
          }
          ($section -join "`n").Trim() | Out-File -Encoding utf8 release-notes.md
          "`nSHA256: ``$hash``" | Out-File -Encoding utf8 -Append release-notes.md
          "SHA256 $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EVKey-Setup-${{ steps.version.outputs.version }}.exe
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Same certificate as local builds ("EVKey Local Signing"), so Accessibility survives in-app updates (ADR 0005).
      # Without the secrets the script falls back to ad-hoc signing.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: ${{ env.P12 != '' }}
        run: |
          kc="$RUNNER_TEMP/evkey.keychain-db"
          kc_pw="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/evkey.p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/evkey.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/evkey.p12"

      - name: Build universal dmg
        run: scripts/build-macos.sh

      - name: Stage dmg and SHA256
        id: dmg
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          dmg="build/EVKey-${VERSION}-universal.dmg"
          test -f "$dmg"
          sha="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA256 $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dmg to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.dmg }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
